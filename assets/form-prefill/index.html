<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Form Prefill</title>
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
  <main>
    <header><img src="/assets/icon.svg" width="40" height="40" alt=""><div><h1 id="title">表单预填</h1><p data-i18n="intro">准备信息，在官网检查和提交。</p></div></header>
    <p class="note" data-i18n="privacy">输入只用于本次预填。请在右侧官网核对内容，完成验证后亲自提交。</p>
    <section id="fields" class="fields" aria-label="Form"></section>
    <div class="actions">
      <button id="prefill" disabled data-i18n="prefill">一键预填</button>
      <button id="open" class="secondary" disabled data-i18n="open">打开官网</button>
    </div>
    <p id="status" role="status" aria-live="polite">正在准备…</p>
    <ul id="report" aria-label="Field results"></ul>
  </main>
  <script src="/assets/ceapp-i18n.js"></script>
  <script src="/assets/app.js"></script>
</body>
</html>
